templates:
  fixture_model:
    positive_fixtures:
      description: "Valid fixtures generated for positive test cases."
      type: array
      items:
        type: object
        required: [test_case_id, payload, traceability_links]
        properties:
          test_case_id:
            type: string
          payload:
            type: object
          description:
            type: string
          traceability_links:
            type: array
            items:
              type: object
              required: [source_id, type]
              properties:
                source_id:
                  type: string
                  description: "ID of the source artifact (requirement, validation rule, or API contract)."
                type:
                  type: string
                  enum: [requirement, validation, api]
                label:
                  type: string
                  description: "Optional human-readable label for the link context."
    negative_fixtures:
      description: "Invalid fixtures generated for negative test cases."
      type: array
      items:
        type: object
        required: [test_case_id, payload, invalid_reason, traceability_links]
        properties:
          test_case_id:
            type: string
          payload:
            type: object
          invalid_reason:
            type: string
          traceability_links:
            type: array
            items:
              type: object
              required: [source_id, type]
              properties:
                source_id:
                  type: string
                  description: "ID of the source artifact (requirement, validation rule, or API contract)."
                type:
                  type: string
                  enum: [requirement, validation, api]
                label:
                  type: string
                  description: "Optional human-readable label for the link context."
    boundary_fixtures:
      description: "Fixtures for boundary test cases."
      type: array
      items:
        type: object
        required: [test_case_id, payload, boundary_condition, traceability_links]
        properties:
          test_case_id:
            type: string
          payload:
            type: object
          boundary_condition:
            type: string
          traceability_links:
            type: array
            items:
              type: object
              required: [source_id, type]
              properties:
                source_id:
                  type: string
                  description: "ID of the source artifact (requirement, validation rule, or API contract)."
                type:
                  type: string
                  enum: [requirement, validation, api]
                label:
                  type: string
                  description: "Optional human-readable label for the link context."
    api_payload_examples:
      description: "API request and response payload examples generated from schemas."
      type: object
      properties:
        requests:
          type: array
          items:
            type: object
            required: [endpoint, method, payload]
            properties:
              endpoint:
                type: string
              method:
                type: string
              payload:
                type: object
              headers:
                type: object
              query_params:
                type: object
              path_params:
                type: object
        responses:
          type: array
          items:
            type: object
            required: [endpoint, method, payload]
            properties:
              endpoint:
                type: string
              method:
                type: string
              payload:
                type: object
              status_code:
                type: integer
              error_type:
                type: string
    summary_metadata:
      description: "Metadata summarizing fixture coverage, counts, and constraint mapping."
      type: object
      required: [fixture_count, positive_count, negative_count, boundary_count, coverage_percentage]
      properties:
        fixture_count:
          type: integer
        positive_count:
          type: integer
        negative_count:
          type: integer
        boundary_count:
          type: integer
        api_payload_count:
          type: integer
        coverage_percentage:
          type: number
        uncovered_constraints:
          type: array
          items:
            type: string
        notes:
          type: string
    gaps_report:
      description: "Report for missing constraints or incomplete schema information."
      type: object
      required: [coverage_percentage]
      properties:
        coverage_percentage:
          type: number
        missing_constraints:
          type: array
          items:
            type: string
        uncovered_requirements:
          type: array
          items:
            type: string
        incomplete_schemas:
          type: array
          items:
            type: string
        suggested_actions:
          type: array
          items:
            type: string
        notes:
          type: string