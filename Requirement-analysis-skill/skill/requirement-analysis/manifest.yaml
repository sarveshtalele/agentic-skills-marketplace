name: requirement-analysis
display_name: Requirement Analysis Skill
version: "1.0.0"
description: >
  Pre-development planning skill. Given a free-text feature request or change
  description, deterministically identifies which file(s) need to be created
  or modified, the exact function/class/line to change, an existing pattern
  to follow, plus the security, compliance, and formatting/linting rules that
  apply. No Anthropic API key required — the host AI (Claude Code / GitHub
  Copilot / Cursor) is the narrative engine.
author: Sarvesh Talele
license: MIT
category: code-analysis
tags:
  - requirement-analysis
  - planning
  - static-analysis
  - security-compliance
  - pre-development
runtime:
  engine: python
  min_version: "3.8"
  entry_point: scripts/requirement_analysis_skill.py
  dependencies: []
tools:
  - run_in_terminal
  - read_file
  - file_search
  - grep_search
inputs:
  - type: free_text
    description: A feature or change request in the user's own words
  - type: repo_path
    description: Root of the repository to analyze (defaults to the current directory)
outputs:
  - "implementation_plan.md"
  - "requirement_analysis.json"
entry_files:
  skill_definition: SKILL.md
  script: scripts/requirement_analysis_skill.py
  references:
    - references/requirement-mapping.md
    - references/security-compliance-rules.md
  templates:
    - templates/implementation_plan.md
companion_skill: change-impact-analysis
