name: change-impact-analysis
display_name: Change Impact Analysis Skill
version: "1.0.0"
description: >
  Deployment-phase Change Impact Analysis for any repository. Given changed
  files (or auto-detected via git), builds a directed dependency graph,
  reverse-BFS traverses it to find every directly and transitively affected
  module, validates API contracts (OpenAPI/GraphQL/Protobuf) for breaking
  changes, maps files to CODEOWNERS, and computes a deterministic 0-100
  deployment risk score. No Anthropic API key required — the host AI
  (Claude Code / GitHub Copilot / Cursor) is the narrative engine.
author: Sarvesh Talele
license: MIT
category: code-analysis
tags:
  - change-impact-analysis
  - deployment-risk
  - dependency-graph
  - static-analysis
  - release-engineering
runtime:
  engine: python
  min_version: "3.8"
  entry_point: scripts/change_impact_skill.py
  dependencies:
    - PyYAML (optional — enables YAML-format OpenAPI spec parsing)
tools:
  - run_in_terminal
  - read_file
  - file_search
  - grep_search
inputs:
  - type: changed_files
    description: An explicit list of changed file paths, or auto-detected via `--from-git`
  - type: repo_path
    description: Root of the repository to analyze (defaults to the current directory)
outputs:
  - "impact_report.md"
  - "impact_analysis.json"
  - "deployment_checklist.md"
entry_files:
  skill_definition: SKILL.md
  script: scripts/change_impact_skill.py
  references:
    - references/dependency-analysis.md
    - references/risk-scoring.md
  templates:
    - templates/impact_report.md
    - templates/deployment_checklist.md
companion_skill: requirement-analysis
