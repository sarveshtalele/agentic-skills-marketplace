name: reverse-engineering-skill
display_name: Reverse Engineering Skill
version: "3.2.0"
description: >
  Reverse engineer any GitHub repository or any project already sitting in a local folder.
  Produces a focused 4-section analysis: System Design Overview, Authentication & Access
  Control (RBAC/ABAC/ReBAC), Business Logic Extractor, and Screen-by-Screen Navigation.
  No Anthropic API key required — GitHub Copilot is the AI engine.
author: Sarvesh Talele
license: MIT
category: code-analysis
tags:
  - reverse-engineering
  - architecture
  - documentation
  - static-analysis
  - authentication
  - github-copilot
runtime:
  engine: python
  min_version: "3.8"
  entry_point: scripts/reverse_engineer_skill.py
  dependencies: []
tools:
  - run_in_terminal
  - read_file
  - create_file
  - insert_edit_into_file
  - file_search
  - grep_search
inputs:
  - type: github_url
    description: A public GitHub repository URL (shallow-cloned, analyzed, then deleted)
  - type: local_path
    description: A folder already on disk (analyzed in place, never modified or deleted)
outputs:
  - "{repo}_report.md"
  - "{repo}_sdd.json"
  - "{repo}_evaluation.md"
  - "manifest.json"
entry_files:
  skill_definition: SKILL.md
  script: scripts/reverse_engineer_skill.py
  references:
    - references/ARCHITECTURE.md
    - references/AUTH_PATTERNS.md
  templates:
    - templates/report_template.md
